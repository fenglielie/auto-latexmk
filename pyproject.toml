[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-latexmk"
version = "0.3.0"
description = "Compile LaTeX projects with automatic engine selection"
readme = "README.md"
authors = [
    {name = "fenglielie", email = "fenglielie@qq.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pathspec>=1.1.1",
    "tqdm>=4.66",
]

[project.scripts]
auto-latexmk = "auto_latexmk.cli:main"
auto-latexmk-clean = "auto_latexmk.cli:clean_main"
auto-latexmk-rebuild = "auto_latexmk.cli:rebuild_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
